<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title>Resume Scorer</title>
		<style>
			:root {
				--bg: #0f1117;
				--panel: #1a1d27;
				--fg: #e6e6e6;
				--muted: #9aa0aa;
				--accent: #4ea1ff;
				--border: #2a2e3a;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				font-family:
					ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				background: var(--bg);
				color: var(--fg);
			}
			header {
				padding: 12px 16px;
				border-bottom: 1px solid var(--border);
				display: flex;
				align-items: center;
				gap: 16px;
			}
			header h1 {
				font-size: 16px;
				margin: 0;
			}
			#scoreBox {
				margin-left: auto;
				display: flex;
				align-items: center;
				gap: 12px;
			}
			#score {
				font-size: 28px;
				font-weight: 700;
			}
			#save {
				background: var(--accent);
				color: #04121f;
				border: 0;
				padding: 8px 16px;
				border-radius: 6px;
				font-weight: 700;
				cursor: pointer;
			}
			#save:disabled {
				opacity: 0.5;
				cursor: default;
			}
			#status {
				margin-left: 12px;
				font-size: 13px;
				color: var(--muted);
			}
			#status a {
				color: var(--accent);
			}
			.opt {
				font-size: 12px;
				color: var(--fg);
				display: flex;
				align-items: center;
				gap: 6px;
				cursor: pointer;
				text-transform: none;
				letter-spacing: 0;
			}
			main {
				display: grid;
				grid-template-columns: 2fr 1fr;
				grid-template-rows: 1fr 1fr;
				gap: 6px;
				padding: 6px;
				height: calc(100vh - 55px);
			}
			.pane {
				border: 1px solid var(--border);
				background: var(--bg);
				display: flex;
				flex-direction: column;
				min-height: 0;
			}
			#resumePane {
				grid-row: 1 / 3;
			}
			.pane h2 {
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--muted);
				margin: 0;
				padding: 10px 14px;
				border-bottom: 1px solid var(--border);
				display: flex;
				align-items: center;
			}
			.pane h2 .opt {
				margin-left: auto;
				text-transform: none;
				letter-spacing: 0;
				font-size: 12px;
				color: var(--fg);
				display: flex;
				align-items: center;
				gap: 6px;
				cursor: pointer;
			}
			#refresh {
				margin-left: auto;
				cursor: pointer;
				color: var(--fg);
				font-size: 14px;
				user-select: none;
				line-height: 1;
			}
			#refresh:hover {
				color: var(--accent);
			}
			#refresh.spin {
				display: inline-block;
				animation: spin 0.6s linear;
			}
			@keyframes spin {
				from {
					transform: rotate(0deg);
				}
				to {
					transform: rotate(360deg);
				}
			}
			.copy {
				cursor: pointer;
				color: var(--fg);
				font-size: 14px;
				user-select: none;
				line-height: 1;
			}
			.copy:hover {
				color: var(--accent);
			}
			#refresh {
				margin-left: auto;
			}
			#copyResume {
				margin-left: 8px;
			}
			#copyJd {
				margin-left: auto;
			}
			#copyReport {
				margin-left: auto;
			}
			textarea {
				flex: 1;
				resize: none;
				border: 0;
				outline: 0;
				padding: 14px;
				background: var(--panel);
				color: var(--fg);
				font: inherit;
				line-height: 1.5;
				min-height: 0;
			}
			#report {
				flex: 1;
				overflow: auto;
				padding: 14px;
				white-space: pre-wrap;
				background: var(--panel);
				font-size: 13px;
				min-height: 0;
			}
			.err {
				color: #ff6b6b;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Resume Scorer</h1>
			<div id="scoreBox">
				<span id="score">–</span>
				<button id="save">Save &amp; Build PDF</button>
				<span id="status"></span>
			</div>
		</header>
		<main>
			<div
				class="pane"
				id="resumePane"
			>
				<h2>
					resume_data.json
					<span id="refresh" title="Reload from disk &amp; re-score">&#10227;</span>
					<span class="copy" id="copyResume" title="Copy JSON">&#10697;</span>
				</h2>
				<textarea
					id="resume"
					spellcheck="false"
					placeholder="Loading…"
				></textarea>
			</div>
			<div
				class="pane"
				id="jdPane"
			>
				<h2>
					Job Description
					<span class="copy" id="copyJd" title="Copy JD">&#10697;</span>
				</h2>
				<textarea
					id="jd"
					spellcheck="false"
					placeholder="Paste a job description…"
				></textarea>
			</div>
			<div
				class="pane"
				id="reportPane"
			>
				<h2>
					Score Report
					<span class="copy" id="copyReport" title="Copy report">&#10697;</span>
					<span class="opt" id="reportOpts">
						<label
							><input type="checkbox" id="auto" checked /> auto</label
						>
						<label
							><input type="checkbox" id="verbose" /> verbose</label
						>
					</span>
				</h2>
				<div id="report">Score will appear here.</div>
			</div>
		</main>

		<script>
			const $ = (id) => document.getElementById(id);

			function scoreColor(s) {
				if (s < 30) return "#ff6b6b";
				if (s < 50) return "#ffa94d";
				if (s < 70) return "#ffe066";
				if (s < 90) return "#74c0fc";
				return "#69db7c";
			}

			function debounce(fn, ms) {
				let t;
				return (...a) => {
					clearTimeout(t);
					t = setTimeout(() => fn(...a), ms);
				};
			}

			async function recalc() {
				const resume = $("resume").value;
				const jd = $("jd").value;
				const verbose = $("verbose").checked;
				try {
					const res = await fetch("/api/score", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ resume, jd, verbose }),
					});
					const data = await res.json();
					if (!data.ok) {
						$("score").textContent = "!";
						$("score").style.color = "#ff6b6b";
						$("report").textContent = data.error;
						$("report").classList.add("err");
						return;
					}
					$("score").textContent = data.score + "/100";
					$("score").style.color = scoreColor(data.score);
					$("report").textContent = data.report;
					$("report").classList.remove("err");
				} catch (e) {
					$("score").textContent = "!";
					$("report").textContent = "Request failed: " + e;
				}
			}

			const debouncedRecalc = debounce(recalc, 400);

			async function save() {
				const btn = $("save");
				btn.disabled = true;
				$("status").textContent = "Building…";
				try {
					const res = await fetch("/api/save", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ resume: $("resume").value }),
					});
					const data = await res.json();
					if (data.ok) {
						$("status").innerHTML =
							'Built! <a href="' +
							data.pdfUrl +
							'" target="_blank">Open resume.pdf</a>';
					} else {
						$("status").textContent =
							"Build failed: " + (data.error || "unknown error");
					}
					if (data.log) console.log(data.log);
				} catch (e) {
					$("status").textContent = "Request failed: " + e;
				} finally {
					btn.disabled = false;
				}
			}

			async function init() {
				const [r, j] = await Promise.all([
					fetch("/api/resume"),
					fetch("/api/jd"),
				]);
				const rj = await r.json(),
					jj = await j.json();
				if (rj.ok) $("resume").value = rj.content;
				if (jj.ok) $("jd").value = jj.content;
				recalc();
			}

			function maybeRecalc() {
				if ($("auto").checked) recalc();
			}
			const debouncedMaybe = debounce(maybeRecalc, 400);

			$("resume").addEventListener("input", debouncedMaybe);
			$("jd").addEventListener("input", debouncedMaybe);
			$("verbose").addEventListener("change", maybeRecalc);
			$("save").addEventListener("click", save);

			async function refreshResume() {
				const icon = $("refresh");
				icon.classList.remove("spin");
				void icon.offsetWidth;
				icon.classList.add("spin");
				try {
					const res = await fetch("/api/resume");
					const data = await res.json();
					if (data.ok) {
						$("resume").value = data.content;
						recalc();
					}
				} catch (e) {
					console.error("Refresh failed:", e);
				}
			}
			$("refresh").addEventListener("click", refreshResume);

			async function copyText(text, btn) {
				const original = btn.textContent;
				try {
					await navigator.clipboard.writeText(text);
				} catch (e) {
					const ta = document.createElement("textarea");
					ta.value = text;
					document.body.appendChild(ta);
					ta.select();
					document.execCommand("copy");
					ta.remove();
				}
				btn.textContent = "✓";
				setTimeout(() => (btn.textContent = original), 800);
			}

			$("copyResume").addEventListener("click", () =>
				copyText($("resume").value, $("copyResume"))
			);
			$("copyJd").addEventListener("click", () =>
				copyText($("jd").value, $("copyJd"))
			);
			$("copyReport").addEventListener("click", () =>
				copyText($("report").textContent, $("copyReport"))
			);

			init();
		</script>
	</body>
</html>
